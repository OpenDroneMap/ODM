name: Docker CPU Image

on:
  push:
    branches:
    - master
    tags:
    - v*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: docker-cpu-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cpu:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    with:
      output: image
      push: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
      file: ./Dockerfile
      target: runtime
      # The SuperBuild nests ninja inside ninja; uncapped, both levels run
      # cores+2 jobs and the free 16 GB runner is starved until GitHub kills
      # it. cmake --build honours this at both levels, so 3 bounds it at 9.
      build-args: |
        CMAKE_BUILD_PARALLEL_LEVEL=3
      platforms: |
        linux/amd64
        linux/arm64
      set-meta-labels: true
      meta-images: opendronemap/odm
      meta-tags: |
        type=edge,branch=master
        type=semver,pattern={{version}}
        type=ref,event=pr
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
