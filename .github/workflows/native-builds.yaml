name: Native Builds

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pixi:
    strategy:
      matrix:
        platform:
          - ubuntu-latest
          - windows-2022
          - macos-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.platform }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.9.3
      with:
        pixi-version: latest
    - name: Install environment
      run: pixi install --locked
    - name: Build SuperBuild
      # The SuperBuild nests ninja inside ninja. Uncapped, each level runs
      # cores+2 jobs and ~30 compilers exhaust the 16 GB runner. cmake
      # --build honours this at both levels, so 3 bounds the total at 9.
      env:
        CMAKE_BUILD_PARALLEL_LEVEL: 3
      run: pixi run build
    - name: Test
      run: pixi run test
    - name: Smoke
      run: pixi run smoke
    - name: Install prod environment
      run: pixi install --locked -e prod
    - name: Prod smoke
      run: pixi run -e prod smoke
